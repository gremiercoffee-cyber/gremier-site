name: Chief of Staff widget

on:
  push:
    paths: ["chief-of-staff/android/**", ".github/workflows/cos-widget.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Signing key
        run: echo "${{ secrets.ANDROID_KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/release.keystore"
      - name: Build APK
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          VERSION_CODE: ${{ github.run_number }}
        run: gradle -p chief-of-staff/android assembleRelease --no-daemon
      - name: Publish to the "cos-widget-latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp chief-of-staff/android/app/build/outputs/apk/release/app-release.apk ChiefOfStaff.apk
          gh release view cos-widget-latest >/dev/null 2>&1 || gh release create cos-widget-latest --target "$GITHUB_SHA" --title "Chief of Staff widget" --notes "Android home-screen widget for Chief of Staff. Install ChiefOfStaff.apk on your phone."
          gh release upload cos-widget-latest ChiefOfStaff.apk --clobber
