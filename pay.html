  <style>
    /* Payment link page in the storefront's checkout style: light page, white cards, rounded fields, pill button. */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --ink:#1a1a1a; --ink2:#5f656d; --ink3:#8a8f96; --line:#e3e5e8; --field:#dcdfe3; --page:#f5f6f7; --brown:#8a5a1c; --green:#2c6e49; --red:#c0392b; }
    html { -webkit-text-size-adjust:100%; }
    body { min-height:100vh; background:var(--page); color:var(--ink); font-family:'DM Sans', system-ui, 'Segoe UI', Arial, sans-serif; font-weight:400; line-height:1.45; }

    .pay-top { position:sticky; top:0; z-index:5; background:rgba(255,255,255,.94); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); border-bottom:1px solid var(--line); }
    .pay-top-in { max-width:520px; margin:0 auto; display:flex; align-items:center; gap:10px; padding:10px 16px; }
    .pay-top a { color:inherit; text-decoration:none; display:flex; align-items:center; gap:10px; flex:1; min-width:0; }
    .pay-top img { width:36px; height:36px; border-radius:50%; object-fit:cover; }
    .pay-top-name { font-family:'Playfair Display', serif; font-weight:700; font-size:1rem; white-space:nowrap; }
    .pay-lang { border:1px solid var(--line); background:#fff; border-radius:999px; padding:6px 12px; font:600 .78rem 'DM Sans', system-ui, sans-serif; color:var(--ink); cursor:pointer; }

    .pay-card { max-width:520px; margin:0 auto; padding:18px 14px 28px; }
    .pay-head { padding:6px 4px 14px; }
    .pay-title { font-family:'Playfair Display', serif; font-size:1.7rem; font-weight:700; line-height:1.15; }
    .pay-head-sub { font-size:.86rem; color:var(--ink2); margin-top:4px; }

    .pay-sec { background:#fff; border:1px solid var(--line); border-radius:16px; padding:16px; margin-bottom:12px; box-shadow:0 2px 6px rgba(28,38,52,.04); }
    .pay-sec-title { display:block; font-size:.8rem; font-weight:600; letter-spacing:.02em; color:var(--ink); margin:0 0 12px; }

    /* Order lines */
    .pay-item { display:flex; align-items:center; gap:12px; padding:8px 0; }
    .pay-item + .pay-item { border-top:1px solid #f0f1f3; }
    .pay-thumb { width:52px; height:52px; border-radius:12px; background:#f3efe9; object-fit:cover; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:1.3rem; }
    .pay-item-text { flex:1; min-width:0; }
    .pay-item-name { font-size:.92rem; font-weight:500; }
    .pay-item-qty { font-size:.76rem; color:var(--ink3); margin-top:1px; }
    .pay-item-price { font-size:.92rem; font-weight:500; white-space:nowrap; }
    .pay-sums { border-top:1px solid var(--line); margin-top:8px; padding-top:6px; }
    .pay-line { display:flex; justify-content:space-between; gap:12px; font-size:.86rem; padding:5px 0; color:var(--ink2); }
    .pay-discount { color:var(--green); }
    .pay-fee-row { display:flex; justify-content:space-between; gap:12px; font-size:.86rem; color:var(--ink2); padding:5px 0; }
    .pay-total { display:flex; justify-content:space-between; align-items:baseline; padding-top:8px; margin-top:4px; border-top:1px solid var(--line); }
    .pay-total-label { font-size:.92rem; font-weight:600; }
    .pay-total-amt { font-family:'Playfair Display', serif; font-size:1.7rem; font-weight:700; }

    /* Fields */
    .pay-field { margin-bottom:12px; }
    .pay-field:last-child { margin-bottom:0; }
    .pay-field label { display:block; font-size:.76rem; color:var(--ink2); margin-bottom:5px; }
    .pay-field label .req { color:var(--red); }
    .pay-field input { width:100%; background:#fff; border:1px solid var(--field); border-radius:12px; padding:12px 14px; font:400 16px 'DM Sans', system-ui, sans-serif; color:var(--ink); transition:border-color .15s, box-shadow .15s; }
    .pay-field input:focus { outline:none; border-color:var(--ink); box-shadow:0 0 0 3px rgba(26,26,26,.08); }
    .pay-field input::placeholder { color:#a7acb2; }
    .pay-field input[type=email], .pay-field input[type=tel] { direction:ltr; }
    body[dir=rtl] .pay-field input[type=email], body[dir=rtl] .pay-field input[type=tel] { text-align:right; }
    .pay-field-hint { font-size:.72rem; color:var(--ink3); margin-top:5px; line-height:1.4; }
    .pay-address-row { display:grid; grid-template-columns:repeat(3, 1fr); gap:8px; }
    .pay-address-row .pay-field { margin-bottom:12px; }
    .pay-field .gp-card input[type=checkbox] { width:auto; flex:none; }
    .pay-field .gp-card label { font-size:13px; color:inherit; margin:8px 0 0; }

    /* Delivery choices as tappable cards */
    .pay-delivery-opts { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
    .pay-delivery-note { grid-column:1 / -1; font-size:.76rem; color:var(--brown); background:#faf4ea; border-radius:10px; padding:8px 10px; }
    .pay-delivery-opt { position:relative; display:flex; flex-direction:column; gap:2px; padding:11px 12px; background:#fff; border:1px solid var(--field); border-radius:12px; cursor:pointer; transition:border-color .15s, box-shadow .15s; min-width:0; }
    .pay-delivery-opt.selected { border-color:var(--ink); box-shadow:inset 0 0 0 1px var(--ink); }
    .pay-delivery-opt input { position:absolute; opacity:0; width:0; height:0; }
    .pay-delivery-dot { display:none; }
    .pay-delivery-text { display:flex; flex-direction:column; }
    .pay-delivery-name { font-size:.86rem; font-weight:600; }
    .pay-delivery-hint { font-size:.72rem; color:var(--ink3); }
    .pay-delivery-price { font-size:.8rem; font-weight:500; min-height:1.1em; }
    #payDeliveryFields { background:#f7f7f8; border-radius:12px; padding:12px; margin-top:10px; }
    .pay-city-wrap { position:relative; }
    .pay-city-list { position:absolute; inset-inline:0; top:100%; z-index:20; margin:4px 0 0; padding:0; list-style:none; background:#fff; border:1px solid var(--field); border-radius:12px; max-height:220px; overflow-y:auto; box-shadow:0 10px 24px rgba(0,0,0,.1); }
    .pay-city-list li { padding:10px 12px; cursor:pointer; font-size:.88rem; }
    .pay-city-list li:hover, .pay-city-list li.active { background:#f6f2ec; }

    /* Pay button and trust line */
    .pay-actions { position:sticky; bottom:0; padding:10px 0 calc(10px + env(safe-area-inset-bottom)); background:linear-gradient(rgba(245,246,247,0), var(--page) 30%); z-index:4; }
    .pay-btn { display:flex; align-items:center; justify-content:center; gap:8px; width:100%; height:54px; border:none; border-radius:999px; cursor:pointer; background:var(--ink); color:#fff; font:600 1rem 'DM Sans', system-ui, sans-serif; letter-spacing:.01em; box-shadow:0 8px 22px rgba(0,0,0,.22); transition:transform .1s, background .2s; text-decoration:none; }
    .pay-btn:active:not(:disabled) { transform:scale(.99); }
    .pay-btn:disabled { opacity:.55; cursor:not-allowed; }
    .pay-btn.ghost { background:#fff; color:var(--ink); border:1px solid var(--field); box-shadow:none; }
    .pay-note { display:flex; align-items:center; justify-content:center; gap:6px; font-size:.76rem; color:var(--green); margin-top:10px; text-align:center; }
    .pay-cards { display:flex; justify-content:center; gap:6px; margin-top:8px; direction:ltr; }
    .pay-cards span { font:700 .62rem 'DM Sans', sans-serif; letter-spacing:.04em; color:var(--ink2); border:1px solid var(--line); background:#fff; border-radius:6px; padding:3px 7px; }
    .pay-help { text-align:center; font-size:.8rem; color:var(--ink2); margin-top:16px; }
    .pay-help a { color:var(--brown); font-weight:600; text-underline-offset:3px; }
    .pay-error { color:var(--red); background:#fdf0ee; border-radius:10px; padding:10px 12px; font-size:.86rem; margin-top:10px; }

    /* Status screens */
    .pay-state { background:#fff; border:1px solid var(--line); border-radius:20px; padding:32px 22px; text-align:center; margin-top:24px; box-shadow:0 2px 6px rgba(28,38,52,.04); }
    .pay-status { width:64px; height:64px; border-radius:50%; margin:0 auto 14px; display:flex; align-items:center; justify-content:center; font-size:1.8rem; background:#eef7f0; color:var(--green); }
    .pay-status.warn { background:#fff6e5; color:#9a6a00; }
    .pay-status-title { font-family:'Playfair Display', serif; font-size:1.5rem; font-weight:700; margin-bottom:8px; }
    .pay-status-sub { font-size:.9rem; color:var(--ink2); line-height:1.55; }
    .pay-state .pay-btn { margin-top:18px; }
    .pay-state .pay-btn + .pay-btn { margin-top:10px; }
    .spinner-wrap { padding:60px 0; color:var(--ink3); font-size:.9rem; text-align:center; }
    .spin { width:28px; height:28px; border-radius:50%; border:3px solid #e3e5e8; border-top-color:var(--ink); margin:0 auto 12px; animation:spin .8s linear infinite; }
    @keyframes spin { to { transform:rotate(360deg); } }
    @media (min-width:700px) { .pay-card { padding-top:32px; } }

// Shows the same options as the website checkout and prices them from the same
// delivery_zones table. The displayed fee is a preview only — create-payment
// recomputes it server-side, so the charge can never be tampered with here.
let payZones = [];
let payZoneSettings = null;

const payCities = JSON.parse(document.getElementById('payCityData').textContent);
let paySelectedCity = null;

const PAY_DELIVERY_OPTIONS = [
  { id: 'regular',   name: 'Regular delivery',  hint: 'Within 2 days' },
  { id: 'expedited', name: 'Expedited delivery', hint: 'Next day' },
  { id: 'event',     name: 'Delivery to event',  hint: 'Specific date and time' },

/* Shipping set by the admin on this link (or an older link with a manual delivery fee line).
   It is pre-filled and its fee is inside the link total. The customer can change it; the fee line then
   comes off and the new choice is priced on the rest. The server does the same (link-shipping.ts). */
function payShippingPreset() {
  const info = paymentLink?.delivery_info && typeof paymentLink.delivery_info === 'object' ? paymentLink.delivery_info : {};
  if (info.shipping_set_by_admin === true) return info;
  const line = (paymentLink?.items || []).find(i => i && i.category === 'delivery_fee');
  return line ? { delivery_type: 'delivery', delivery_label: 'Delivery', delivery_fee: Number(line.price || 0) * Number(line.qty || 1) } : null;
}
function payPresetType() {
  const p = payShippingPreset();
  if (!p) return null;
  return !p.delivery_type || p.delivery_type === 'delivery' ? 'regular' : p.delivery_type;
}
function payFeeLinesTotal() {
  const sum = (paymentLink?.items || []).reduce((t, i) => t + (i && i.category === 'delivery_fee' ? (Number(i.price) || 0) * (Number(i.qty) || 1) : 0), 0);
  return Math.round(sum * 100) / 100;
}
/** The link total without any delivery the admin added. */
function payBaseTotal() {
  return Math.round(Math.max(0, (Number(paymentLink?.total) || 0) - payFeeLinesTotal()) * 100) / 100;
}
function payPresetCity() {
  const p = payShippingPreset();
  if (!p || (!p.city_en && !p.city_he)) return null;
  const en = payNormCity(p.city_en), he = String(p.city_he || '').trim();
  return payCities.find(c => (en && payNormCity(c.en) === en) || (he && String(c.he || '').trim() === he))
    || { en: p.city_en || '', he: p.city_he || '', code: null };
}
function payPresetHasCity() {
  const p = payShippingPreset();
  return !!(p && (p.city_en || p.city_he));
}
function payCityMatchesPreset() {
  if (!payPresetHasCity()) return true;
  if (!paySelectedCity) return false;
  const p = payShippingPreset();
  return (!!p.city_en && payNormCity(p.city_en) === payNormCity(paySelectedCity.en))
    || (!!p.city_he && String(p.city_he).trim() === String(paySelectedCity.he || '').trim());
}
/** True while the customer's choice is still the delivery set on the link. */
function payIsPresetChoice() {
  if (payDeliveryType !== payPresetType()) return false;
  return payDeliveryType === 'pickup' || payCityMatchesPreset();
}
/** Fills in the delivery set on the link, once. Everything stays editable. */
let payPresetApplied = false;
function applyPayPreset() {
  if (payPresetApplied) return;
  payPresetApplied = true;
  const p = payShippingPreset();
  if (!p) return;
  payDeliveryType = payPresetType();
  const city = payPresetCity();

}

function payNormCity(v) {
  return String(v || '').toLowerCase().trim().replace(/['"`]/g, '').replace(/\s+/g, ' ');
}

function findPayZone() {
  if (!paySelectedCity) return null;
  const code = String(paySelectedCity.code || '').trim();
  const en = payNormCity(paySelectedCity.en);
  const he = String(paySelectedCity.he || '').trim();
  return payZones.find(z => {
    if (code && z.city_code && String(z.city_code) === code) return true;
    const zEn = payNormCity(z.name_en);
    return (zEn && en && (zEn === en || zEn.includes(en) || en.includes(zEn)))
        || (!!he && String(z.name_he || '').trim() === he);
  }) || null;
}

/** Mirrors quoteDeliveryFee on the server so the preview matches the charge. */
function payFeeFor(type) {
  if (type === 'pickup') return 0;
  const zone = findPayZone();
  const regular = zone ? (Number(zone.regular_price) || 0)
                       : (Number(payZoneSettings?.default_regular_price) || 30);
  const expedited = zone ? (Number(zone.expedited_price) || 0)
                         : (Number(payZoneSettings?.default_expedited_price) || 50);
  const eventPrice = zone
    ? (zone.event_price != null ? Number(zone.event_price) : expedited)
    : (Number(payZoneSettings?.default_event_price) || 80);
  const freeAbove = zone?.free_above ? Number(zone.free_above) : null;
  const base = payBaseTotal();
  if (type === 'expedited') return expedited;
  if (type === 'event') return eventPrice;
  return (freeAbove != null && base >= freeAbove) ? 0 : regular;
}

/** The fee for an option as things stand, or null until a city is chosen. */
function payOptionFee(type) {
  if (type === payPresetType() && (type === 'pickup' || payCityMatchesPreset())) return payFeeLinesTotal();
  if (type === 'pickup') return 0;
  return paySelectedCity ? payFeeFor(type) : null;
}

function updatePayDeliveryQuote() {
  const base = payBaseTotal();

  PAY_DELIVERY_OPTIONS.forEach(o => {
    const el = document.getElementById('payOptPrice_' + o.id);
    if (!el) return;
    const optionFee = payOptionFee(o.id);

  if (feeLabel) feeLabel.textContent = T().deliveryFee + ' · ' + (T().opts[payDeliveryType]?.[0] || '');
  if (totalEl) totalEl.textContent = money(base + fee);

function exactPayCity(value) {
  const q = payNormCity(value);

  const matches = payCities.filter(c => [c.en, c.he, `${c.he} · ${c.en}`].some(name => payNormCity(name) === q));
  if (matches.length === 1) return matches[0];
  const preset = payPresetCity();
  return preset && [preset.en, preset.he, `${preset.he} · ${preset.en}`].some(name => payNormCity(name) === q) ? preset : null;

function onPayCityInput(value) {

async function callCreatePayment({ linkCode, orderId, deliveryAddress, customerName, customerEmail, customerPhone } = {}) {

  if (addressInfo) body.address = addressInfo;
  if (orderId) body.order_id = orderId;
  if (linkCode) body.payment_link_code = linkCode;
  if (!body.order_id && !body.payment_link_code) throw new Error('Payment setup error');
  if (deliveryAddress) body.delivery_address = deliveryAddress;
  const chosenDelivery = typeof getPayDeliveryInfo === 'function' ? getPayDeliveryInfo() : null;
  if (chosenDelivery) body.delivery_info = chosenDelivery;
  if (customerName) body.customer_name = customerName;
  if (customerEmail) body.customer_email = customerEmail;
  if (customerPhone) body.customer_phone = customerPhone;

  const res = await fetch(`${SUPABASE_URL}/functions/v1/create-payment`, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'apikey': SUPABASE_ANON_KEY,
      'Authorization': 'Bearer ' + SUPABASE_ANON_KEY,
    },
    body: JSON.stringify(body),
  });

  const data = await res.json().catch(() => ({}));
  if (!res.ok || !data.sale_url) {
    const errMsg = data.error || data.message || `Could not start PayMe payment (${res.status})`;
    if (/hello undefined/i.test(errMsg)) {
      throw new Error('Payment service needs redeploying — run deploy-functions.bat');
    }
    throw new Error(errMsg);
  }
  return data;
}

  const el = document.getElementById('payName');
  return el ? el.value.trim() : '';
}

function cleanPayCustomerName(name) {
  const value = String(name || '').trim();
  if (!value || /^payment link customer$/i.test(value)) return '';
  return value;
}

function getPayNameForCheckout(link) {
  return getPayName() || cleanPayCustomerName(link?.customer_name) || '';
}

function getPayLinkDisplayName(link) {
  if (!link) return '';
  return String(
    link.link_name ||
    link.payment_link_name ||
    link.reference_name ||
    link.internal_name ||
    link.title ||
    link.name ||
    ''
  ).trim();
}

function getPayItemImage(item) {
  if (!item) return '';
  if (item.thumbnail_url) return item.thumbnail_url;
  if (item.thumbnail) return item.thumbnail;
  if (item.image_url) return item.image_url;
  if (item.image) return item.image;
  if (Array.isArray(item.images) && item.images[0]) return item.images[0];
  return '';
}

function payInputValue(value) {
  return esc(String(value || ''));
}
  function isValidEmail(email) {
    return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(email || '').trim());
  }

  function isValidPhone(phone) {
    const digits = String(phone || '').replace(/\D/g, '');
    return digits.length >= 9 && digits.length <= 15;
  }

  function getPayEmailForCheckout(link) {
    return getPayEmail() || link.customer_email || '';
  }

  function getPayPhoneForCheckout(link) {
    return getPayPhone() || link.customer_phone || '';
  }

    const email = getPayEmailForCheckout(link);
    if (!email) return '';
    link.customer_email = email;
    return email;
  }

  async function savePayLinkCustomerPhone(link) {
    const phone = getPayPhoneForCheckout(link);
    if (!phone) return '';
    link.customer_phone = phone;
    return phone;
  }

  async function savePayCustomerEmail(orderId, link) {
    const email = getPayEmailForCheckout(link);
    if (!email) return;
    await savePayLinkCustomerEmail(link);

  async function savePayCustomerPhone(orderId, link) {

  function getPayAddressForCheckout(link) {

  async function savePayDeliveryAddress(orderId, link) {

    if (!addr) return;

  function renderState(icon, title, sub, buttons, warn) {
    document.getElementById('payCard').innerHTML = `<div class="pay-state">
      ${icon ? `<div class="pay-status${warn ? ' warn' : ''}">${icon}</div>` : '<div class="spin"></div>'}
      <div class="pay-status-title">${title}</div>
      ${sub ? `<div class="pay-status-sub">${sub}</div>` : ''}
      ${buttons || ''}
    </div>${payHelpHtml()}`;
  }

  function payHelpHtml() {
    return `<div class="pay-help">${T().help} <a href="https://wa.me/972552703413" target="_blank" rel="noopener">${T().helpLink}</a></div>`;
  }

  function renderInvalid() { renderState('!', T().invalid, '', `<a href="index.html" class="pay-btn ghost">${T().back}</a>`, true); }

  function renderNotFound() { renderState('!', T().notFound, '', `<a href="index.html" class="pay-btn ghost">${T().back}</a>`, true); }

  function renderPaid() {
    const total = paymentLink?.total != null && paymentLink.total !== '' ? money(paymentLink.total) : '';
    renderState('✓', T().paidTitle, T().paidSub(total), `<a href="index.html" class="pay-btn">${T().back}</a>`);
  }

  function renderFailed() {
    renderState('!', T().failTitle, T().failSub,
      `<button class="pay-btn ghost" onclick="recheckPayment()">${T().check}</button><button class="pay-btn" onclick="retryPayment()">${T().retry}</button>`, true);
  }

  function renderProcessing() { renderState('', T().waitTitle, T().waitSub); }

  function showPaymentConfirmed(targetId) {
    navPayPush('paid');
    applyPayView('paid');
    if (targetId) clearCheckoutSession(targetId);
  }

  function paymeSaleIdForOrder(id) {
    if (!id) return '';
    try {
      return sessionStorage.getItem(payStorageKey(id, 'sale')) || '';
    } catch (_) {
      return '';
    }
  }

  async function syncPaidOrderToSheet(targetId, maxAttempts) {
    let id = targetId || orderId;
    for (let i = 0; i < maxAttempts; i++) {
      if (!id) {
        try { id = sessionStorage.getItem('gremier_pay_last_order') || ''; } catch (_) {}
      }
      if (!id) return;

      try {
        const data = await confirmPaymentReturn();
        if (data.order_id) {
          orderId = data.order_id;
          id = data.order_id;
        }
      } catch (e) {
        console.warn('confirm during sync:', e);
      }

      const notifyResult = await queuePaidOrderForOps(id, i > 0);
      if (notifyResult?.sent || notifyResult?.skipped === 'already_notified') return;

      await new Promise(r => setTimeout(r, i < 2 ? 600 : 1500));
    }
  }

  async function finishPaidReturn(oid, opts) {
    opts = opts || {};
    if (linkCode) {
      const link = await loadPaymentLinkByCode(linkCode);
      if (link) paymentLink = link;
    }

    let targetId = oid || orderId;
    if (await checkPaidLocally()) {
      showPaymentConfirmed(targetId);
      syncPaidOrderToSheet(targetId, 20).catch(function (e) {
        console.warn('Background payment sync:', e);
      });
      return;
    }
    // Only show confirmed after the server verifies PayMe and returns paid:true.
    for (let i = 0; i < 2; i++) {
      const data = await confirmPaymentReturn();
      if (data.order_id) {
        orderId = data.order_id;
        targetId = data.order_id;
      }
      if (data.paid) {
        showPaymentConfirmed(targetId);
        syncPaidOrderToSheet(targetId, 20).catch(function (e) {
          console.warn('Background payment sync:', e);
        });
        return;
      }
      if (i < 1) await new Promise(r => setTimeout(r, 600));
    }

    renderFailed();
    navPayReplace('failed');
  }

  async function getReturnPayload() {
    const p = new URLSearchParams(window.location.search);
    const txn = p.get('transaction_id') || (linkCode ? `pl_${linkCode}` : '');
    let resolvedOrderId = p.get('order_id') || orderId
      || (function () { try { return sessionStorage.getItem('gremier_pay_last_order') || ''; } catch (_) { return ''; } })()
      || (txn && !txn.startsWith('pl_') ? txn.split('_')[0] : '');

    let resolvedLinkCode = linkCode || p.get('code') || '';
if (!resolvedLinkCode && resolvedOrderId) {
      try { resolvedLinkCode = sessionStorage.getItem(payStorageKey(resolvedOrderId, 'code')) || ''; } catch (_) {}
    }

    if (!resolvedOrderId && resolvedLinkCode) {
      const lnk = await loadPaymentLinkByCode(resolvedLinkCode);
      resolvedOrderId = lnk?.last_order_id || (!isReusableLink(lnk) && lnk?.order_id) || '';
    }

    let paymeSaleId = p.get('payme_sale_id') || p.get('sale_id') || '';
    if (!paymeSaleId && resolvedOrderId) {
      try { paymeSaleId = sessionStorage.getItem(payStorageKey(resolvedOrderId, 'sale')) || ''; } catch (_) {}
    }
    if (!paymeSaleId && paymentLink?.payme_sale_id) paymeSaleId = paymentLink.payme_sale_id;

    return {
      order_id: resolvedOrderId,
      link_code: resolvedLinkCode,
      transaction_id: txn || resolvedOrderId || (resolvedLinkCode ? `pl_${resolvedLinkCode}` : ''),
      payment_return: isPaymentReturnUrl(),
      payme_status: p.get('payme_status') || p.get('payme_status_code') || '',
      status: p.get('status') || '',
      sale_status: p.get('sale_status') || p.get('payme_sale_status') || '',
      payme_sale_id: paymeSaleId,
      payme_transaction_id: p.get('payme_transaction_id') || '',
    };
  }

  function hasExplicitPaymentFailure() {
    const p = new URLSearchParams(window.location.search);
    const st = String(p.get('payme_status') || p.get('status') || p.get('sale_status') || p.get('payme_sale_status') || '').toLowerCase();
    if (!st) return false;
    return ['failed', 'error', 'cancelled', 'canceled', 'declined', '0'].includes(st);
  }

  async function checkPaidLocally() {
    if (linkCode) {
      const link = await loadPaymentLinkByCode(linkCode);
      if (link) {
        paymentLink = { ...(paymentLink || {}), ...link };
        if (link.order_id && !isReusableLink(link)) orderId = link.order_id;
        if (PAID_STATUSES.includes(link.status) && !isReusableLink(link)) return true;
      }
    }
    return false;
  }

  function isPaymentReturnUrl() {
    const p = new URLSearchParams(window.location.search);
    if (p.get('payment') === 'return') return true;
    const paymeKeys = ['payme_status', 'payme_sale_status', 'sale_status', 'payme_sale_id', 'payme_transaction_id'];
    return paymeKeys.some(k => p.has(k));
  }

  async function confirmPaymentReturn() {
    const controller = new AbortController();
    const timer = setTimeout(function () { controller.abort(); }, 10000);
    try {
      const res = await fetch(`${SUPABASE_URL}/functions/v1/confirm-payment-return`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'apikey': SUPABASE_ANON_KEY,
          'Authorization': 'Bearer ' + SUPABASE_ANON_KEY,
        },
        body: JSON.stringify(await getReturnPayload()),
        signal: controller.signal,
      });
      const data = await res.json().catch(function () { return {}; });
      if (!res.ok && !data.error) data.error = 'HTTP ' + res.status;
      if (data.order_id) orderId = data.order_id;
      return data;
    } catch (e) {
      console.warn('confirmPaymentReturn:', e);
      return { paid: false, error: String(e) };
    } finally {
      clearTimeout(timer);
    }
  }

  /** Queue paid order for Ops scheduling.
   * Public client intentionally does not call notify-paid-order.
   * confirm-payment-return must verify PayMe server-side and trigger email/Ops sync itself.
   */
  async function queuePaidOrderForOps(oid, force) {
    return { skipped: 'client_notify_disabled' };
  }

  async function recheckPayment() {
    renderProcessing();
    if (await checkPaidLocally()) {
      await finishPaidReturn(orderId);
      return;
    }
    for (let i = 0; i < 3; i++) {
      const data = await confirmPaymentReturn();
      if (data.paid) {
        orderId = data.order_id || orderId;
        await finishPaidReturn(orderId);
        return;
      }
      if (i < 2) await new Promise(r => setTimeout(r, 800));
    }
    renderFailed();
  }

  async function handleReturn() {
    if (!isPaymentReturnUrl()) return false;

    const p = params;
    orderId = p.get('order_id') || p.get('transaction_id');
    if (orderId && orderId.includes('_') && !orderId.startsWith('pl_')) {
      const uuid = orderId.match(/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/i);
      if (uuid) orderId = uuid[0];
    }
    if (!orderId) {
      try { orderId = sessionStorage.getItem('gremier_pay_last_order') || ''; } catch (_) {}
    }

    if (linkCode) {
      const link = await loadPaymentLinkByCode(linkCode);
      if (link) {
        paymentLink = link;
        if (!orderId && link.order_id && !isReusableLink(link)) orderId = link.order_id;
      }
    }

    if (await checkPaidLocally()) {
      await finishPaidReturn(orderId);
      return true;
    }
    // Keep the customer in a confirming state until the server verifies PayMe.
    renderProcessing();
    navPayReplace('pending');

    for (let attempt = 0; attempt < 2; attempt++) {
      try {
        const data = await confirmPaymentReturn();
        if (data.order_id) orderId = data.order_id;
        if (data.paid) {
          await finishPaidReturn(orderId);
          return true;
        }
      } catch (err) {
        console.warn('Payment confirm attempt failed:', err);
      }
      if (attempt < 1) await new Promise(r => setTimeout(r, 600));
    }

    if (hasExplicitPaymentFailure()) {
      navPayPush('failed');
      applyPayView('failed');
    } else {
      renderFailed();
      navPayReplace('failed');
    }
    return true;
  }

function esc(s) {
  return String(s || '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

  async function retryPayment() {

    if (await checkPaidLocally()) {
      navPayPush('paid');
      applyPayView('paid');
      return;
    }

    if (linkCode) {
      const link = await loadPaymentLinkByCode(linkCode);
      if (link) paymentLink = link;
    }

    if (!paymentLink) return;

    applyPayView('checkout');

    navPayReplace('checkout');

  }



  async function startPayment() {
    if (paymentStarting) return;

    const btn = document.getElementById('payBtn');
    const errEl = document.getElementById('payError');

    if (await checkPaidLocally()) {
      navPayPush('paid');
      applyPayView('paid');
      return;
    }

    paymentStarting = true;
    if (btn) { btn.disabled = true; btn.textContent = T().redirecting; }
    if (errEl) errEl.style.display = 'none';

    try {
      const deliveryErr = typeof validatePayDelivery === 'function' ? validatePayDelivery() : '';
      if (deliveryErr) {
        if (errEl) { errEl.textContent = deliveryErr; errEl.style.display = 'block'; }
        paymentStarting = false;
        if (btn) { btn.disabled = false; btn.textContent = T().pay(document.getElementById('payTotalAmt')?.textContent || ''); }
        return;
      }
      const deliveryAddress = getPayAddressForCheckout(paymentLink);
      const customerName = getPayNameForCheckout(paymentLink);

if (!customerName) {
  if (errEl) {
    errEl.textContent = T().errName;
    errEl.style.display = 'block';
  }
  paymentStarting = false;
  if (btn) {
    btn.disabled = false;
    btn.textContent = T().pay(document.getElementById('payTotalAmt')?.textContent || '');
  }
  return;
}
      const customerEmail = getPayEmailForCheckout(paymentLink);
      const customerPhone = getPayPhoneForCheckout(paymentLink);
      if (!customerEmail || !isValidEmail(customerEmail)) {
        if (errEl) { errEl.textContent = T().errEmail; errEl.style.display = 'block'; }
        paymentStarting = false;
        if (btn) { btn.disabled = false; btn.textContent = T().pay(document.getElementById('payTotalAmt')?.textContent || ''); }
        return;
      }
      if (!customerPhone || !isValidPhone(customerPhone)) {
        if (errEl) { errEl.textContent = T().errPhone; errEl.style.display = 'block'; }
        paymentStarting = false;
        if (btn) { btn.disabled = false; btn.textContent = T().pay(document.getElementById('payTotalAmt')?.textContent || ''); }
        return;
      }
      if (!isReusableLink(paymentLink)) {
  await savePayLinkDeliveryAddress(paymentLink);
  await savePayLinkCustomerEmail(paymentLink);
  await savePayLinkCustomerPhone(paymentLink);
}
      navPayReplace('checkout');

      // Reusable links always get a fresh order per payment — never reuse link.order_id.
      if (paymentLink.order_id && !isReusableLink(paymentLink)) {
        orderId = paymentLink.order_id;
      } else {
      orderId = await ensureOrderId(paymentLink);
        if (!isReusableLink(paymentLink)) paymentLink.order_id = orderId;
        if (isReusableLink(paymentLink)) paymentLink.last_order_id = orderId;
      }
      await savePayDeliveryAddress(orderId, paymentLink);
      await savePayCustomerEmail(orderId, paymentLink);
      await savePayCustomerPhone(orderId, paymentLink);

      let payData;
      try {
        payData = await callCreatePayment({ orderId, linkCode: paymentLink.link_code, deliveryAddress: deliveryAddress || undefined, customerName, customerEmail, customerPhone });
      } catch (e) {
        const msg = (e.message || '').toLowerCase();
        if (msg.includes('already paid')) {
          try { await finishPaidReturn(orderId); } catch (_) {}
          return;
        }
        const tryLinkCode = msg.includes('not found') || msg.includes('missing order') || msg.includes('order_id');
        if (tryLinkCode) {
         payData = await callCreatePayment({
  linkCode: paymentLink.link_code,
  orderId,
  deliveryAddress: deliveryAddress || undefined,
  customerName: customerName || undefined,
  customerEmail: customerEmail || undefined,
  customerPhone: customerPhone || undefined,
});
        } else {
          throw e;
        }
      }

      rememberCheckoutSession(orderId, payData.payme_sale_id, paymentLink.link_code);
      window.location.href = payData.sale_url;
    } catch (e) {
      paymentStarting = false;
      if (btn) { btn.disabled = false; btn.textContent = T().pay(document.getElementById('payTotalAmt')?.textContent || ''); }
      if (errEl) { errEl.textContent = e.message || 'Payment error'; errEl.style.display = 'block'; }
    }
  }



  async function init() {

    window.addEventListener('popstate', handlePayPopState);



    if (!linkCode) {

      applyPayView('invalid');

      navPayReplace('invalid');

      return;

    }

    if (await handleReturn()) return;



    const link = await loadPaymentLinkByCode(linkCode);

    if (!link) {

      applyPayView('notfound');

      navPayReplace('notfound');

      return;

    }

    paymentLink = link;



    if (PAID_STATUSES.includes(link.status) && !isReusableLink(link)) {

      applyPayView('paid');

      navPayReplace('paid');

      return;

    }



    applyPayView('checkout');

    navPayReplace('checkout');

  }



  init();
