name = "chief-of-staff"
main = "worker/index.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

# The built React app is served as static assets; /api/* is handled by the Worker.
[assets]
directory = "./dist"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "chief-of-staff"
database_id = "7b4ec7b1-cece-4e94-adf7-67e8ad5067ee"
migrations_dir = "migrations"

# Proactive pass: morning briefing, overdue/reminder checks, stale "waiting for" nudges.
[triggers]
crons = ["*/5 * * * *"]

[vars]
# Everything runs on Luna (a tenth of Terra's price); filling in forms uses Terra.
MODEL_BRAIN = "gpt-6-luna"
MODEL_WRITER = "gpt-6-luna"
MODEL_MAIN = "gpt-6-luna"
MODEL_CAREFUL = "gpt-6.1-terra"
MODEL_FAST = "gpt-6-luna"
EFFORT_MAIN = "low"    # none | low | medium | high | xhigh | max
EFFORT_FAST = "none"
TRANSCRIBE_MODEL = "gpt-transcribe"
# Live voice: OpenAI Realtime over WebRTC
REALTIME_MODEL = "gpt-realtime-2.1-mini"
REALTIME_TRANSCRIBE_MODEL = "gpt-transcribe"
TIMEZONE = "UTC"
# Web Push: public half of the VAPID key (private half is the VAPID_PRIVATE_JWK secret)
VAPID_PUBLIC_KEY = "BKQ-bHmoAA3cPy3kzbG6suVI3FyU7nnLIDp8Nln7w6Br_v8nc9CNIemlkFXkx88kah7CXzee7M6uc7NBfTzen_I"
VAPID_SUBJECT = "https://chief-of-staff.gremiercoffee.workers.dev"

# Secrets (never in the frontend) â€” set with `wrangler secret put <NAME>`:
#   COS_ACCESS_TOKEN  passcode the app uses to talk to the API
#   OPENAI_API_KEY     model provider key (chat, brain dump, briefings, dictation)
