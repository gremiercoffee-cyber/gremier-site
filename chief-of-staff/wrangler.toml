name = "chief-of-staff"
main = "worker/index.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

# The built React app is served as static assets; /api/* is handled by the Worker.
[assets]
directory = "./dist"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "chief-of-staff"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"
migrations_dir = "migrations"

# Proactive pass: morning briefing, overdue/reminder checks, stale "waiting for" nudges.
[triggers]
crons = ["*/15 * * * *"]

[vars]
# OpenAI GPT-6 Luna for both tiers; the fast tier just reasons less.
MODEL_MAIN = "gpt-6-luna"
MODEL_FAST = "gpt-6-luna"
EFFORT_MAIN = "low"    # none | low | medium | high | xhigh | max
EFFORT_FAST = "none"
TRANSCRIBE_MODEL = "whisper-1"
TIMEZONE = "UTC"

# Secrets (never in the frontend) — set with `wrangler secret put <NAME>`:
#   COS_ACCESS_TOKEN  passcode the app uses to talk to the API
#   OPENAI_API_KEY     model provider key (chat, brain dump, briefings, dictation)
